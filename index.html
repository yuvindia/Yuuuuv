<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>yuuuuv</title>
<link rel="preconnect" href="https://ogevzxqoypsroxsqiwhp.supabase.co"><link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<style>
:root{--bg:#000;--card:#121212;--line:#262626;--tx:#fff;--mut:#8e8e8e;--ch:var(--tx);--chtx:var(--bg)}
:root[data-t=light]{--bg:#fff;--card:#f4f4f4;--line:#e3e3e3;--tx:#000;--mut:#6b6b6b}
:root[data-c=blue]{--ch:#0095f6;--chtx:#fff}
:root[data-c=purple]{--ch:#8b5cf6;--chtx:#fff}
:root[data-c=green]{--ch:#22c55e;--chtx:#fff}
:root[data-c=pink]{--ch:#ec4899;--chtx:#fff}
:root[data-c=orange]{--ch:#f97316;--chtx:#fff}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);height:100dvh;display:flex;flex-direction:column}
#app{flex:1;display:flex;flex-direction:column;min-height:0;max-width:560px;width:100%;margin:auto}
#v{flex:1;display:flex;flex-direction:column;min-height:0}
header{padding:10px 14px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);font-weight:700;font-size:18px}
header span{flex:1}
.i{display:inline-flex}
.ib{background:none;border:0;color:var(--tx);padding:4px;font-size:22px;display:inline-flex;align-items:center}
.logo{font-size:24px;letter-spacing:-1px;font-weight:800}
.biglogo{font-size:48px;font-weight:800;letter-spacing:-2px;text-align:center;margin:40px 0 4px}
.tag{text-align:center;color:var(--mut);margin-bottom:24px;font-size:14px}
.pad{padding:14px;overflow:auto;flex:1}
.scr{flex:1;overflow:auto}
.scr.pad{padding:14px}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:16px;margin-bottom:10px;font-family:inherit}
textarea{min-height:90px;resize:none}
.sq{border-radius:24px}
.btn{width:100%;padding:11px;border:0;border-radius:10px;background:var(--tx);color:var(--bg);font-size:15px;font-weight:600;margin-bottom:10px}
.btn.o{background:var(--card);color:var(--tx)}
.sm{border:0;border-radius:8px;background:var(--tx);color:var(--bg);padding:7px 14px;font-size:14px;font-weight:600}
.sm.o{background:var(--card);color:var(--tx)}
.link{background:none;border:0;color:var(--mut);width:100%;padding:8px;font-size:14px}
.err{color:var(--mut);font-size:14px;margin-bottom:8px;min-height:18px}
.row{padding:9px 0;display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.grow small{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h3{margin:18px 0 8px;font-size:13px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.av{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.av.xl{width:86px;height:86px;font-size:34px}
.av.mini{width:34px;height:34px;font-size:14px}
.vb{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--tx);color:var(--bg);font-size:10px;margin-left:5px;vertical-align:middle}
.stories{display:flex;gap:12px;overflow-x:auto;padding:12px 14px;scrollbar-width:none}
.sb{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;flex:none;width:68px;color:var(--mut);overflow:hidden;white-space:nowrap}
.sb .av{width:64px;height:64px;border:2px solid var(--tx);padding:2px}
.sb.add .av{border-style:dashed;font-size:26px;font-weight:400}
.tabs{display:flex;border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.tb{flex:1;text-align:center;padding:12px 0;color:var(--mut);font-weight:600;font-size:15px}
.tb.on{color:var(--tx);box-shadow:inset 0 -2px var(--tx)}
.card{padding-bottom:6px}
.card .top,.th .top{display:flex;align-items:center;gap:10px;padding:8px 14px}
.th .top{padding:0 0 2px}
.card .pic{width:100%;display:block;background:var(--card);max-height:75vh;object-fit:cover}
.acts{display:flex;align-items:center;gap:2px;padding:6px 10px}
.th .acts{padding:6px 0}
.cnt{font-size:14px;margin:0 10px 0 2px;min-width:8px}
.cap{padding:0 14px 8px;font-size:15px}
.ago{color:var(--mut);font-size:13px}
.th{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.thl{display:flex;flex-direction:column;align-items:center;gap:4px}
.line{width:2px;flex:1;background:var(--line);border-radius:2px}
.thr{flex:1;min-width:0}
.txt{font-size:16px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.ptop{display:flex;align-items:center;gap:20px;padding:14px}
.pst{display:flex;flex:1;justify-content:space-around;text-align:center}
.st{cursor:pointer}
.st b{display:block;font-size:17px}
.st small{color:var(--mut);font-size:12px}
.pinfo{padding:0 14px 10px;font-size:15px}
.pbio{margin-top:2px;white-space:pre-wrap}
.pbtns{display:flex;gap:8px;padding:0 14px}
.pbtns .btn{margin:0 0 10px}
.ptabs{display:flex;border-top:1px solid var(--line)}
.pt{flex:1;display:flex;justify-content:center;padding:12px 0;color:var(--mut)}
.pt.on{color:var(--tx);box-shadow:inset 0 -2px var(--tx)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--card)}
.reels{flex:1;overflow-y:auto;scroll-snap-type:y mandatory}
.reel{height:calc(100dvh - 125px);scroll-snap-align:start;position:relative;background:#000;color:#fff}
.reel video{width:100%;height:100%;object-fit:cover}
.reel .side{position:absolute;right:12px;bottom:90px;display:flex;flex-direction:column;align-items:center;gap:2px}
.reel .rb{background:none;border:0;color:#fff}
.reel .info{position:absolute;left:12px;bottom:16px;right:70px;text-shadow:0 1px 4px #000}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:9px 13px;border-radius:18px;background:var(--card);word-wrap:break-word}
.me{align-self:flex-end;background:var(--ch);color:var(--chtx)}
.m small{display:block;font-size:10px;opacity:.6;margin-top:2px}
#bar{display:flex;gap:4px;padding:8px;border-top:1px solid var(--line);align-items:center}
#bar input{margin:0;flex:1;border-radius:22px}
#emo{display:none;flex-wrap:wrap;gap:4px;padding:8px;border-top:1px solid var(--line);max-height:140px;overflow:auto}
#emo span{font-size:26px;padding:3px}
nav{display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:12px 0;display:flex;justify-content:center}
nav button.on{color:var(--tx)}
#ov{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:30}
#ov img{max-width:100%;max-height:100%}
#ov .ovt{position:absolute;top:16px;left:16px;color:#fff;font-weight:700}
.bk{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:560px;margin:auto;border-radius:18px 18px 0 0;max-height:80dvh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:14px}
.sheet .pic{width:100%;border-radius:12px}
.sheet .cl{overflow:auto;max-height:45dvh}
.cm{padding:6px 0;font-size:15px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:14px;z-index:50}
.sk{height:84px;margin:12px 14px;border-radius:12px;background:linear-gradient(90deg,var(--card),var(--line),var(--card));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sr{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.seg{display:flex;background:var(--card);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--tx);padding:8px;border-radius:8px;font-size:14px}
.seg button.on{background:var(--tx);color:var(--bg)}
.dots{display:flex;gap:14px;padding:6px 0}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line)}
.dot.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--tx)}
.empty{color:var(--mut);padding:30px 20px;text-align:center}
.auth{display:flex;flex-direction:column;justify-content:center}
</style></head>
<body><div id="app">Loading…</div>
<script>
window.addEventListener("error",function(e){var a=document.getElementById("app");if(a&&a.textContent==="Loading…")a.textContent="Error: "+(e.message||("could not load "+(e.target&&e.target.src)))},true);
setTimeout(function(){var a=document.getElementById("app");if(a&&a.textContent==="Loading…"&&!window.__ok)a.textContent="app1.js did not start. Check that app1.js to app6.js all exist in the repository."},8000);
setTimeout(function(){var a=document.getElementById("app");if(a&&a.textContent==="Loading…"&&window.__ok)a.textContent="App started but cannot reach Supabase. Open supabase.com and tap Restore project if it is paused."},12000);
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
(function(){var f=["app1.js","app2.js","app3.js","app4.js","app5.js","app6.js"];f.forEach(function(n){var s=document.createElement("script");s.src=n+"?v=4";s.async=false;document.body.appendChild(s)})})();
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")</script>
</body></html>
