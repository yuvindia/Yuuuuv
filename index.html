<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>yuuuuv</title>
<link rel="preconnect" href="https://ogevzxqoypsroxsqiwhp.supabase.co"><link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<style>
:root{--bg:#000;--card:#121212;--line:#262626;--tx:#fff;--mut:#8e8e8e}
:root[data-t=light]{--bg:#fff;--card:#f4f4f4;--line:#e3e3e3;--tx:#000;--mut:#6b6b6b}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);height:100dvh;display:flex;flex-direction:column}
#app{flex:1;display:flex;flex-direction:column;min-height:0;max-width:560px;width:100%;margin:auto}
#v{flex:1;display:flex;flex-direction:column;min-height:0}
header{padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);font-weight:700;font-size:18px}
header span{flex:1}
header button{background:none;border:0;color:var(--tx);font-size:24px;padding:0 4px}
.logo{font-size:24px;letter-spacing:-1px;font-weight:800}
.pad{padding:14px;overflow:auto;flex:1}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:16px;margin-bottom:10px}
.btn{width:100%;padding:12px;border:0;border-radius:12px;background:var(--tx);color:var(--bg);font-size:16px;font-weight:600;margin-bottom:10px}
.btn.o{background:none;color:var(--tx);border:1px solid var(--line)}
.sm{border:0;border-radius:10px;background:var(--tx);color:var(--bg);padding:7px 14px;font-size:14px;font-weight:600}
.sm.o{background:none;color:var(--tx);border:1px solid var(--line)}
.link{background:none;border:0;color:var(--mut);width:100%;padding:8px;font-size:14px}
.err{color:var(--mut);font-size:14px;margin-bottom:8px}
.row{padding:9px 2px;display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.grow small{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h3{margin:16px 0 8px;font-size:14px;color:var(--mut);font-weight:600}
.av{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.av.big{width:84px;height:84px;font-size:32px}
.av.mini{width:32px;height:32px;font-size:14px}
.vb{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--tx);color:var(--bg);font-size:10px;margin-left:5px;vertical-align:middle}
.stories{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.sb{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;flex:none;width:64px;color:var(--mut);overflow:hidden;white-space:nowrap}
.sb .av{width:60px;height:60px;border:2px solid var(--tx)}
.sb.add .av{border-style:dashed;font-size:26px;font-weight:400}
.card{margin-bottom:20px}
.card .top{display:flex;align-items:center;gap:10px;padding:6px 0}
.card img.pic{width:100%;border-radius:12px;display:block}
.acts{display:flex;align-items:center;gap:8px;padding:8px 0}
.ic{background:none;border:0;color:var(--tx);font-size:24px;padding:0 4px 0 0}
.cap{font-size:15px}
.stats{display:flex;justify-content:space-around;text-align:center;margin:14px 0}
.stats div{cursor:pointer}
.stats b{display:block;font-size:18px}
.stats small{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.reels{flex:1;overflow-y:auto;scroll-snap-type:y mandatory}
.reel{height:calc(100dvh - 132px);scroll-snap-align:start;position:relative;background:#000;color:#fff}
.reel video{width:100%;height:100%;object-fit:cover}
.reel .side{position:absolute;right:12px;bottom:90px;display:flex;flex-direction:column;align-items:center;gap:2px}
.reel .rb{background:none;border:0;color:#fff;font-size:34px}
.reel .info{position:absolute;left:12px;bottom:16px;right:70px;text-shadow:0 1px 4px #000}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:9px 13px;border-radius:16px;background:var(--card);word-wrap:break-word}
.me{align-self:flex-end;background:var(--tx);color:var(--bg)}
.m small{display:block;font-size:10px;opacity:.6;margin-top:2px}
#bar{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
#bar input{margin:0;flex:1}
#bar button{border:0;border-radius:12px;background:var(--card);color:var(--tx);padding:0 12px;font-size:18px}
#emo{display:none;flex-wrap:wrap;gap:4px;padding:8px;border-top:1px solid var(--line);max-height:140px;overflow:auto}
#emo span{font-size:26px;padding:3px}
nav{display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:12px 0;font-size:22px;opacity:.5}
nav button.on{opacity:1}
#ov{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:30}
#ov img{max-width:100%;max-height:100%}
#ov .ovt{position:absolute;top:16px;left:16px;color:#fff;font-weight:700}
.bk{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:560px;margin:auto;border-radius:18px 18px 0 0;max-height:70dvh;display:flex;flex-direction:column;padding:14px}
.sheet .cl{overflow:auto;flex:1;margin-bottom:10px}
.cm{padding:6px 0;font-size:15px}
</style></head>
<body><div id="app">Loading…</div>
<script>
window.addEventListener("error",function(e){var a=document.getElementById("app");if(a&&a.textContent==="Loading…")a.textContent="Error: "+(e.message||("could not load "+(e.target&&e.target.src)))},true);
setTimeout(function(){var a=document.getElementById("app");if(a&&a.textContent==="Loading…"&&!window.__ok)a.textContent="app1.js did not start. Check that app1.js to app4.js all exist in the repository."},8000);
setTimeout(function(){var a=document.getElementById("app");if(a&&a.textContent==="Loading…"&&window.__ok)a.textContent="App started but cannot reach Supabase. Open supabase.com and tap Restore project if it is paused."},12000);
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
(function(){var f=["app1.js","app2.js","app3.js","app4.js"];f.forEach(function(n){var s=document.createElement("script");s.src=n+"?v=3";s.async=false;document.body.appendChild(s)})})();
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")</script>
</body></html>
